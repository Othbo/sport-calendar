<title>Mon Calendrier Sport</title>
<style>
  :root {
    --bg: #FAF8F5;
    --ink: #2B2B2B;
    --ink-soft: #8A8378;
    --accent: #E85D3D;
    --accent-soft: #FBE4DC;
    --done: #1B4332;
    --done-soft: #DCEBE2;
    --empty: #EFEBE4;
    --card: #FFFFFF;
    --line: #E8E2D8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    height: 100%;
    overscroll-behavior-y: none;
  }

  body {
    display: flex;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  #app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    padding: 20px 20px 40px;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* Header */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .top h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .top .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  /* Stat banner */
  .stat-row {
    display: flex;
    gap: 10px;
    margin: 20px 0 22px;
  }

  .stat {
    flex: 1;
    background: var(--card);
    border-radius: 18px;
    padding: 14px 16px;
    border: 1px solid var(--line);
  }

  .stat .num {
    font-size: 26px;
    font-weight: 800;
    color: var(--done);
    line-height: 1;
  }

  .stat.streak .num {
    color: var(--accent);
  }

  .stat .label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
    font-weight: 500;
  }

  /* Month nav */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .month-nav .month-label {
    font-size: 19px;
    font-weight: 700;
    text-transform: capitalize;
  }

  .nav-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--card);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
  }

  .nav-btn:active {
    background: var(--empty);
  }

  .nav-group {
    display: flex;
    gap: 8px;
  }

  /* Calendar grid */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 8px;
  }

  .weekdays span {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .day {
    aspect-ratio: 1;
    border-radius: 14px;
    border: none;
    background: var(--empty);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    position: relative;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }

  .day:active {
    transform: scale(0.92);
  }

  .day.empty {
    background: transparent;
    cursor: default;
  }

  .day.today {
    box-shadow: inset 0 0 0 2px var(--accent);
  }

  .day.done {
    background: var(--done);
    color: white;
  }

  .day.future {
    color: var(--ink-soft);
    opacity: 0.6;
  }

  .day .check {
    position: absolute;
    bottom: 4px;
    font-size: 9px;
  }

  /* Bottom nudge */
  .footer-note {
    margin-top: 28px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .legend {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 18px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .legend .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: -1px;
  }

  .dot.done { background: var(--done); }
  .dot.today { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }

  .loading {
    text-align: center;
    color: var(--ink-soft);
    padding: 40px 0;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div>
      <h1>Sport 🏃</h1>
      <div class="subtitle" id="today-str"></div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat">
      <div class="num" id="stat-month">0</div>
      <div class="label">Séances ce mois</div>
    </div>
    <div class="stat streak">
      <div class="num" id="stat-streak">0</div>
      <div class="label">Jours de suite</div>
    </div>
  </div>

  <div class="month-nav">
    <div class="month-label" id="month-label"></div>
    <div class="nav-group">
      <button class="nav-btn" id="prev-btn">‹</button>
      <button class="nav-btn" id="next-btn">›</button>
    </div>
  </div>

  <div class="weekdays">
    <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
  </div>

  <div class="grid" id="grid">
    <div class="loading">Chargement…</div>
  </div>

  <div class="legend">
    <span><span class="dot done"></span>Sport fait</span>
    <span><span class="dot today"></span>Aujourd'hui</span>
  </div>

  <div class="footer-note">Touche un jour pour le cocher ou décocher.<br>Tes données restent sur cet appareil.</div>
</div>

<script>
  const STORAGE_KEY = 'sport-days';
  let sportDays = new Set(); // format 'YYYY-MM-DD'
  let viewDate = new Date();
  viewDate.setDate(1);

  const todayObj = new Date();
  const todayKey = fmtKey(todayObj);

  function fmtKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function fmtDateLong(d) {
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  document.getElementById('today-str').textContent = fmtDateLong(todayObj).replace(/^./, c => c.toUpperCase());

  async function loadData() {
    try {
      const result = await window.storage.get(STORAGE_KEY);
      if (result && result.value) {
        const arr = JSON.parse(result.value);
        sportDays = new Set(arr);
      }
    } catch (e) {
      // clé pas encore créée, ou erreur -> on part de vide
      sportDays = new Set();
    }
    render();
  }

  async function saveData() {
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(Array.from(sportDays)));
    } catch (e) {
      console.error('Erreur de sauvegarde', e);
    }
  }

  function toggleDay(key) {
    if (sportDays.has(key)) {
      sportDays.delete(key);
    } else {
      sportDays.add(key);
    }
    saveData();
    render();
  }

  function computeStreak() {
    // compte les jours consécutifs jusqu'à aujourd'hui (ou hier si aujourd'hui pas encore fait)
    let streak = 0;
    let cursor = new Date(todayObj);
    // si aujourd'hui pas fait, on commence à hier
    if (!sportDays.has(fmtKey(cursor))) {
      cursor.setDate(cursor.getDate() - 1);
    }
    while (sportDays.has(fmtKey(cursor))) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function computeMonthCount(year, month) {
    let count = 0;
    for (const key of sportDays) {
      const [y, m] = key.split('-').map(Number);
      if (y === year && m === month + 1) count++;
    }
    return count;
  }

  function render() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();

    document.getElementById('month-label').textContent =
      viewDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

    document.getElementById('stat-month').textContent = computeMonthCount(year, month);
    document.getElementById('stat-streak').textContent = computeStreak();

    const firstOfMonth = new Date(year, month, 1);
    // lundi = 0 ... dimanche = 6
    let startOffset = (firstOfMonth.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    for (let i = 0; i < startOffset; i++) {
      const filler = document.createElement('div');
      filler.className = 'day empty';
      grid.appendChild(filler);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateObj = new Date(year, month, day);
      const key = fmtKey(dateObj);
      const btn = document.createElement('button');
      btn.className = 'day';
      btn.textContent = day;

      if (sportDays.has(key)) btn.classList.add('done');
      if (key === todayKey) btn.classList.add('today');
      if (dateObj > todayObj && key !== todayKey) btn.classList.add('future');

      btn.addEventListener('click', () => toggleDay(key));
      grid.appendChild(btn);
    }
  }

  document.getElementById('prev-btn').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    render();
  });

  document.getElementById('next-btn').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    render();
  });

  loadData();
</script>
</body>
</html>
